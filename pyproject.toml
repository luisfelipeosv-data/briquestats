[project]
name = "briquestats"
version = "0.1.0"
description = "Controle financeiro para revendedores: inventário, lucro, ROI e giro."
requires-python = ">=3.12"

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [".venv", "migrations", "staticfiles"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["config", "accounts", "inventory", "dashboard"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = "-q"
testpaths = ["inventory/tests"]
